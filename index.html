<style>

<header class="top">

</header>

<main class="wrap">

  <section id="pane-mc" role="tabpanel" aria-labelledby="tab-mc" hidden><div class="bar"><div class="chips" id="mc-chips"></div><span class="count" id="mc-count"></span></div><div id="mc-card"></div></section>
  <section id="pane-vocab" role="tabpanel" aria-labelledby="tab-vocab" hidden><div class="bar"><div class="chips" id="vocab-chips"></div><span class="count" id="vocab-count"></span></div><div id="vocab-card"></div></section>
  <section id="pane-eq" role="tabpanel" aria-labelledby="tab-eq" hidden><div class="bar"><div class="chips" id="eq-chips"></div><span class="count" id="eq-count"></span></div><div id="eq-card"></div></section>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const uniq=a=>[...new Set(a)];
const store={get(k,d){try{const v=localStorage.getItem('energy:'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('energy:'+k,JSON.stringify(v));}catch(e){}}};

/* ================= DATA ================= */
// [term, definition, aliases, on the objective sheet?]
const VOCAB=[
 ['Autotroph','An organism that makes its own food, usually from sunlight by photosynthesis, like plants, algae, and some bacteria.',['autotrophs','producer'],1],
 ['Heterotroph','An organism that cannot make its own food and gets energy by eating other organisms, like animals and fungi.',['heterotrophs','consumer'],1],
 ['ATP','Adenosine triphosphate: the cell’s main energy molecule. It has 3 phosphate groups, and breaking off the third one releases energy the cell can use.',['adenosine triphosphate'],1],
 ['ADP','Adenosine diphosphate: ATP after it has lost a phosphate and released its energy. It has 2 phosphate groups and can be recharged into ATP.',['adenosine diphosphate'],1],
 ['Chloroplast','The organelle in plant and algae cells where photosynthesis happens. It contains the green pigment chlorophyll.',['chloroplasts'],1],
 ['Mitochondria','The organelles where aerobic cellular respiration happens, turning the energy in glucose into ATP. The “powerhouse of the cell.”',['mitochondrion','mitochondrias'],1],
 ['Aerobic respiration','Cellular respiration that uses oxygen. It breaks glucose down completely in the mitochondria and makes about 36 ATP per glucose.',['aerobic'],1],
 ['Anaerobic respiration','Breaking down glucose without oxygen (glycolysis plus fermentation). It happens in the cytoplasm and makes only 2 ATP per glucose.',['anaerobic','fermentation'],1],
 ['Chlorophyll','The green pigment in chloroplasts that absorbs light energy for photosynthesis.',[],0],
 ['Thylakoid','Flattened sacs inside the chloroplast where the light-dependent reactions happen. A stack of them is a granum.',['thylakoids','grana','granum'],0],
 ['Stroma','The fluid inside the chloroplast around the thylakoids, where the Calvin cycle makes glucose.',[],0],
 ['Light-dependent reactions','The first stage of photosynthesis, in the thylakoids: light energy splits water, releases oxygen, and makes ATP and NADPH.',['light dependent reactions','light reactions'],0],
 ['Calvin cycle','The second stage of photosynthesis, in the stroma: uses ATP, NADPH, and CO₂ to build glucose. It doesn’t need light directly.',['light-independent reactions','light independent reactions','dark reactions','calvin'],0],
 ['Glycolysis','The first step of cellular respiration, in the cytoplasm: splits glucose into 2 pyruvic acid and makes 2 ATP. It doesn’t need oxygen.',[],0],
 ['Krebs cycle','The second stage of aerobic respiration, in the mitochondria: breaks pyruvic acid down further and releases CO₂.',['citric acid cycle','krebs'],0],
 ['Electron transport chain','The last stage of aerobic respiration, in the inner membrane of the mitochondria. It uses oxygen and makes most of the ATP.',['etc','electron transport'],0],
 ['Fermentation','Making ATP without oxygen by continuing after glycolysis. Two types: lactic acid (muscles) and alcoholic (yeast).',[],0],
 ['Lactic acid fermentation','Fermentation in muscle cells when oxygen runs low; makes lactic acid, which causes the burning feeling during hard exercise.',['lactic acid'],0],
 ['Alcoholic fermentation','Fermentation in yeast that makes ethyl alcohol and CO₂. It makes bread rise.',['alcohol fermentation'],0],
];
const PH={left:[[6,'co2'],[6,'h2o']],right:[[1,'c6h12o6'],[6,'o2']]};
const RS={left:[[1,'c6h12o6'],[6,'o2']],right:[[6,'co2'],[6,'h2o']]};
const SHOW={co2:'CO₂',h2o:'H₂O',c6h12o6:'C₆H₁₂O₆',o2:'O₂'};
const NAME={co2:'carbon dioxide',h2o:'water',c6h12o6:'glucose',o2:'oxygen'};
const fmt=([c,sp])=>`${c>1?c:''}${SHOW[sp]}`;

/* ================= grading helpers ================= */
const SUB={'₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9'};
const clean=s=>String(s).toLowerCase().replace(/[’`]/g,"'").replace(/[₀-₉]/g,d=>SUB[d]).replace(/\s+/g,' ').replace(/^[\s.!?,;:]+|[\s.!?,;:]+$/g,'').trim();
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
const ENERGY=['energy','atp','light','sunlight','lightenergy','sunlightenergy','energyatp','atpenergy','heat','energyfromsunlight','energy(atp)','atp(energy)','light(energy)'];
function term(t){ let x=clean(t).replace(/[\s()]/g,''); if(!x) return null;
  const m=x.match(/^(\d*)(.*)$/); let c=m[1]?+m[1]:1, sp=m[2];
  const map={carbondioxide:'co2',co2:'co2',water:'h2o',h2o:'h2o',glucose:'c6h12o6',sugar:'c6h12o6',c6h12o6:'c6h12o6',oxygen:'o2',o2:'o2',oxygengas:'o2'};
  if(ENERGY.includes(sp)||ENERGY.includes(x)) return {e:true};
  if(!(sp in map)) return {bad:sp};
  return {c,sp:map[sp]}; }
function side(str){ return str.split('+').map(term).filter(Boolean); }
function eqCheck(expect){ return typed=>{
  const parts=clean(typed).split(/-+>|=+>|→|=/); if(parts.length!==2) return {r:'no',msg:'Write it as reactants → products (type -> for the arrow).'};
  const L=side(parts[0]).filter(t=>!t.e), R=side(parts[1]).filter(t=>!t.e);
  if([...L,...R].some(t=>t.bad)) return {r:'no',msg:'One of the terms isn’t a molecule in this equation.'};
  const key=a=>a.map(t=>t.c+t.sp).sort().join('+'), sp=a=>a.map(t=>t.sp).sort().join('+');
  const eL=expect.left.map(([c,s])=>({c,sp:s})), eR=expect.right.map(([c,s])=>({c,sp:s}));
  if(key(L)===key(eL)&&key(R)===key(eR)) return {r:'ok'};
  if(sp(L)===sp(eR)&&sp(R)===sp(eL)) return {r:'no',msg:'You flipped the sides: reactants and products are swapped.'};
  if(sp(L)===sp(eL)&&sp(R)===sp(eR)) return {r:'no',msg:'Right molecules, wrong numbers. Check the 6’s (coefficients).'};
  return {r:'no',msg:'Some molecules are missing or on the wrong side.'}; }; }
function termCheck(expect){ return typed=>{ const t=term(typed);
  if(expect==='e') return t&&t.e?{r:'ok'}:{r:'no'};
  if(!t||t.e||t.bad) return {r:'no'};
  if(t.sp!==expect[1]) return {r:'no'};
  if(t.c!==expect[0]) return {r:'no',msg:expect[0]===1?'Glucose has no coefficient in front (just 1).':`Right molecule, but it needs the coefficient ${expect[0]}.`};
  return {r:'ok'}; }; }
function check(it,typed){
  if(it.check){ const r=it.check(typed); return r; }
  const t=clean(typed), alts=it.ans.map(clean);
  if(alts.includes(t)) return {r:'ok'};
  if(alts.some(a=>a.length>5&&lev(a,t)<=(a.length>12?2:1))) return {r:'ok',msg:'Watch the spelling.'};
  return {r:'no'}; }

/* ================= UI pieces ================= */
let TALLY=store.get('tally',{r:0,t:0});
const drawTally=()=>{$('#tally').textContent=`${TALLY.r} / ${TALLY.t}`;};
const bump=(ok,undo)=>{ if(undo){TALLY.r++;} else {TALLY.t++; if(ok) TALLY.r++;} store.set('tally',TALLY); drawTally(); };
$('#reset').onclick=()=>{TALLY={r:0,t:0};store.set('tally',TALLY);drawTally();}; drawTally();
function chips(id,opts,k,onChange){ let cur=store.get(k,Object.keys(opts)[0]); if(!(cur in opts)) cur=Object.keys(opts)[0];
  const draw=()=>{ $('#'+id).innerHTML=Object.entries(opts).map(([x,l])=>`<button class="chip" data-k="${x}" aria-pressed="${String(cur)===String(x)}">${l}</button>`).join('');
    document.querySelectorAll('#'+id+' .chip').forEach(c=>c.onclick=()=>{ cur=c.dataset.k; store.set(k,cur); draw(); onChange(); }); };
  draw(); return ()=>cur; }
function mc(q,a,pool,why,label,fixed){ const d=shuffle(uniq(pool).filter(x=>x!==a)).slice(0,3); return {q,a,choices:fixed?[...fixed]:shuffle([a,...d]),why,label}; }
const typed=(q,ans,why,label,extra={})=>({q,ans:Array.isArray(ans)?ans:[ans],why,label,...extra});
const blank='<span class="blank">___</span>';
const subsBar=`<div class="subs" aria-label="Quick insert">${['₂','₆','₁₂','→','+'].map(c=>`<button type="button" data-c="${c==='→'?' → ':c==='+'?' + ':c}" tabindex="-1">${c}</button>`).join('')}</div>`;

/* ================= drill engine ================= */
let ACTIVE=null;
function drill(id,gens){
  const getK=chips(id+'-chips',Object.fromEntries(Object.entries(gens).map(([k,g])=>[k,g.label])),id+'K',()=>{S.pending=[];S.r=0;S.t=0;next();});
  const S={pending:[],cur:null,state:'ask',typed:'',res:null,r:0,t:0,last:''};
  const gen=()=>{ let k=getK(); if(k==='mix') k=pick(Object.keys(gens).filter(x=>x!=='mix')); for(let i=0;i<12;i++){ const it=gens[k].fn(); if(it.q!==S.last) return it; } return gens[k].fn(); };
  function next(){ S.pending.forEach(p=>p.w--); const d=S.pending.findIndex(p=>p.w<=0); let it;
    if(d>=0){ it={...S.pending.splice(d,1)[0].it,again:true}; if(it.choices&&!it.fixed) it.choices=shuffle(it.choices); } else it=gen();
    S.cur=it; S.last=it.q; S.state='ask'; S.typed=''; S.res=null; S.pick=null; render(); }
  function finish(ok){ S.t++; if(ok) S.r++; else S.pending.push({it:S.cur,w:3}); bump(ok); S.state='done'; render(); }
  function render(){ const it=S.cur, el=$('#'+id+'-card'), done=S.state==='done';
    $('#'+id+'-count').textContent=`${S.r} / ${S.t}${S.pending.length?` · ${S.pending.length} coming back`:''}`;
    let body='';
    if(it.choices){ body=`<div class="choices">${it.choices.map((c,i)=>{ let cls=''; if(done){ if(c===it.a) cls='right'; else if(c===S.pick) cls='wrong'; }
        return `<button class="choice ${cls}" data-i="${i}" ${done?'disabled':''}><span class="k">${i+1}</span><span>${c}</span></button>`; }).join('')}</div>`; }

<ul><li><b>Using energy:</b> ATP → ADP + P + <b>energy</b> (the cell spends it on work like active transport, muscle movement, and making proteins).</li>
<li><b>Recharging:</b> ADP + P + energy from glucose → ATP. That energy comes from <b>cellular respiration</b>.</li>
<li>Think of ATP as a <b>charged battery</b> and ADP as a <b>drained battery</b>.</li></ul></div>

<div class="card"><h2>ATP and glucose</h2>
<p><b>Glucose</b> is like a big bank account: it stores a lot of energy for the long term. <b>ATP</b> is like cash in your pocket: small amounts the cell can spend right away.</p>
<p>Cells can’t use glucose’s energy directly. <b>Cellular respiration</b> breaks glucose down and uses its energy to make ATP: about <b>36 ATP</b> per glucose with oxygen, or just <b>2 ATP</b> without oxygen.</p></div>

<div class="card"><h2>Photosynthesis</h2>
<div class="bigeq">6CO₂ + 6H₂O + light → C₆H₁₂O₆ + 6O₂<small>carbon dioxide + water + light energy → glucose + oxygen</small></div>
<h3>Where it happens</h3>
<svg viewBox="0 0 520 210" role="img" aria-label="Chloroplast diagram" style="width:100%;max-width:520px;display:block;margin:0 auto">
  <ellipse cx="230" cy="105" rx="210" ry="85" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="3"/>
  ${[110,190,270,350].map(x=>[0,1,2,3].map(k=>`<rect x="${x-24}" y="${74+k*16}" width="48" height="12" rx="6" fill="var(--accent)" opacity=".85"/>`).join('')).join('')}
  <line x1="350" y1="70" x2="455" y2="40" stroke="var(--muted)"/><text x="458" y="44" font-size="14" fill="var(--ink)">Thylakoid stack</text>
  <text x="458" y="60" font-size="12" fill="var(--muted)">light reactions</text>
  <line x1="230" y1="165" x2="455" y2="175" stroke="var(--muted)"/><text x="458" y="172" font-size="14" fill="var(--ink)">Stroma</text>
  <text x="458" y="188" font-size="12" fill="var(--muted)">Calvin cycle</text>
  <text x="230" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">Chloroplast</text>
</svg>
<ul><li>In the <b>chloroplasts</b> of plant cells, mostly in <b>leaves</b> (also algae and some bacteria).</li>
<li><b>Chlorophyll</b> (green pigment) captures the light.</li>
<li><b>Light-dependent reactions</b> in the <b>thylakoids</b>: light splits water, releases O₂, makes ATP and NADPH.</li>
<li><b>Calvin cycle</b> in the <b>stroma</b>: uses ATP, NADPH, and CO₂ to build glucose.</li></ul></div>

<div class="card"><h2>Cellular respiration</h2>
<div class="bigeq">C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy (ATP)<small>glucose + oxygen → carbon dioxide + water + energy</small></div>
<ul><li><b>Glycolysis</b> in the <b>cytoplasm</b>: glucose → 2 pyruvic acid, 2 ATP. No oxygen needed.</li>
<li><b>Krebs cycle</b> in the <b>mitochondria</b>: releases CO₂.</li>
<li><b>Electron transport chain</b> in the mitochondria: uses O₂ and makes most of the ATP.</li>
<li>Done by almost all living things, <b>including plants</b>.</li></ul>
<h3>They’re opposites</h3>
<div class="tw"><table><tr><th></th><th>Photosynthesis</th><th>Cellular respiration</th></tr>
<tr><td>Where</td><td>Chloroplasts</td><td>Mitochondria (+ cytoplasm)</td></tr>
<tr><td>Reactants</td><td>CO₂, H₂O, light</td><td>Glucose, O₂</td></tr>
<tr><td>Products</td><td>Glucose, O₂</td><td>CO₂, H₂O, ATP</td></tr>
<tr><td>Energy</td><td>Stores energy in glucose</td><td>Releases energy as ATP</td></tr>
<tr><td>Who</td><td>Autotrophs (plants, algae)</td><td>Almost all organisms</td></tr></table></div></div>

<div class="card"><h2>Aerobic vs. anaerobic respiration</h2>
<div class="tw"><table><tr><th></th><th>Aerobic</th><th>Anaerobic</th></tr>
<tr><td>Oxygen?</td><td>Yes</td><td>No</td></tr>
<tr><td>Where</td><td>Mitochondria (after glycolysis)</td><td>Cytoplasm</td></tr>
<tr><td>Steps</td><td>Glycolysis → Krebs cycle → electron transport chain</td><td>Glycolysis → fermentation</td></tr>
<tr><td>ATP per glucose</td><td>About 36</td><td>2</td></tr>
<tr><td>Products</td><td>CO₂ + H₂O</td><td>Lactic acid (muscles) or alcohol + CO₂ (yeast)</td></tr>
<tr><td>Example</td><td>Jogging, normal breathing</td><td>Sprinting (muscle burn), bread rising</td></tr></table></div></div>

<div class="card"><h2>Vocabulary</h2><p class="tip">Terms marked <span class="extra">extra</span> aren’t on your objective sheet but show up in Chapters 8 and 9.</p>${vocRows}</div>`;
